aws:
  region: eu-north-1
  account_id: '262439760474'
collector:
  lookback_days: 30
  services:
  - AmazonEC2
  - AmazonRDS
  - AmazonS3
  - AWSLambda
  - AmazonCloudWatch
  - AWSDataTransfer
  cloudwatch:
    ec2_instance_ids:
    - i-072363b796c653791
    - i-009af27e544641905
    - i-028c352b124fc4acb
    rds_instance_id: finops-db
    lambda_functions:
    - finops-collector
    - finops-analyzer
    - finops-alerter
    period_seconds: 3600
    s3_buckets:
    - finops-forgotten-louay
    - finops-cur-data-louay
    - finops-logs-louay
storage:
  bucket: finops-cur-data-louay
  prefix: collected/
  synthetic_prefix: cur/
  format: parquet
analyzer:
  llm:
    provider: groq
    model: openai/gpt-oss-120b
    max_tokens: 2000
  output:
    bucket: finops-cur-data-louay
    prefix: anomalies/
recommender:
  llm:
    provider: groq
    model: openai/gpt-oss-120b
    max_tokens: 2000
  output:
    bucket: finops-cur-data-louay
    prefix: recommendations/
rag:
  llm:
    provider: groq
    model: openai/gpt-oss-120b
    max_tokens: 1024
  chroma:
    persist_path: ../chroma_db
    collection: finops
  embedding_model: all-MiniLM-L6-v2
