# FinOps Agent — Configuration
# Changer ce fichier suffit pour brancher sur une autre infra AWS

aws:
  region: eu-north-1
  account_id: "262439760474"

collector:
  lookback_days: 30
  services:
    - AmazonEC2
    - AmazonRDS
    - AmazonS3
    - AWSLambda
    - AmazonCloudWatch
    - AWSDataTransfer

  cloudwatch:
    ec2_instance_ids:
      - i-0a1b2c3d4e5f60001
      - i-0a1b2c3d4e5f60002
      - i-0a1b2c3d4e5f60003
    rds_instance_id: finops-db
    lambda_functions:
      - finops-collector
      - finops-analyzer
      - finops-alerter
    period_seconds: 3600

storage:
  bucket: finops-cur-data-louay
  prefix: collected/
  synthetic_prefix: cur/
  format: parquet

analyzer:
  llm:
    provider: groq
    model: openai/gpt-oss-120b
    max_tokens: 2000
  output:
    bucket: finops-cur-data-louay
    prefix: anomalies/

recommender:
  llm:
    provider: groq
    model: openai/gpt-oss-120b
    max_tokens: 2000
  output:
    bucket: finops-cur-data-louay
    prefix: recommendations/

rag:
  llm:
    provider: groq
    model: openai/gpt-oss-120b
    max_tokens: 1024
  chroma:
    persist_path: ../chroma_db
    collection: finops
  embedding_model: all-MiniLM-L6-v2